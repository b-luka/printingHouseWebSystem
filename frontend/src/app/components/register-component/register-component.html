<div class = 'register-container'>
  <div class = 'register-box'>
    <a routerLink = '/' class = 'btn-back'>⬅ Back to Home</a>

    <h2>Register an account</h2>

    @if (message) {
      <div [class] = 'isSuccess ? "success-message" : "error-message"'>
        {{ message }}
      </div>
    }

    <form (ngSubmit) = 'register()'>

      <div class = 'form-group'>
        <label for = 'userType'>User Type:</label>
        <select id = 'userType' [(ngModel)] = 'userType' name = 'userType' class = 'form-control'>
          <option value = 'client_individual'>Client (Individual)</option>
          <option value = 'client_legal'>Client (Corporate)</option>
          <option value = 'printer'>Printer</option>
        </select>
      </div>

      <div class = 'form-row'>
        <div class = 'form-group'>
          <label for = 'username'>Username:*</label>
          <input type = 'text' id = 'username' [(ngModel)] = 'username' name = 'username' required>
        </div>
        <div class = 'form-group'>
          <label for = 'email'>Email:*</label>
          <input type = 'email' id = 'email' [(ngModel)] = 'email' name = 'email' required>
        </div>
      </div>

      <div class = 'form-row'>
        <div class = 'form-group'>
          <label for = 'password'>Password:*</label>
          <input type = 'password' id = 'password' [(ngModel)] = 'password' name = 'password' required>
        </div>
        <div class = 'form-group'>
          <label for = 'confirmPassword'>Confirm Password:*</label>
          <input type = 'password' id = 'confirmPassword' [(ngModel)] = 'confirmPassword' name = 'confirmPassword' required>
        </div>
      </div>

      <div class = 'form-row'>
        <div class = 'form-group'>
          <label for = 'firstname'>First Name:</label>
          <input type = 'text' id = 'firstname' [(ngModel)] = 'firstname' name = 'firstname'>
        </div>
        <div class = 'form-group'>
          <label for = 'lastname'>Last Name:</label>
          <input type = 'text' id = 'lastname' [(ngModel)] = 'lastname' name = 'lastname'>
        </div>
      </div>

      <div class = 'form-group'>
        <label for = 'phone'>Phone:</label>
        <input type = 'text' id = 'phone' [(ngModel)] = 'phone' name = 'phone'>
      </div>

      @if (userType === 'printer' || userType === 'client_legal') {
        <div class = 'printer-section'>
          @if (userType == 'printer') {
            <h3>Printer Details</h3>
          }
          @else {
            <h3>Company Details</h3>
          }
          <div class = 'form-group'>
            <label for = 'institutionName'>Institution Name:</label>
            <input type = 'text' id = 'institutionName' [(ngModel)] = 'institutionName' name = 'institutionName'>
          </div>
          <div class = 'form-group'>
            <label for = 'headquartersAddress'>Address:</label>
            <input type = 'text' id = 'headquartersAddress' [(ngModel)] = 'headquartersAddress' name = 'headquartersAddress'>
          </div>
          <div class = 'form-row'>
            <div class = 'form-group'>
              <label for = 'city'>City:</label>
              <input type = 'text' id = 'city' [(ngModel)] = 'city' name = 'city'>
            </div>
            <div class = 'form-group'>
              <label for = 'taxId'>Tax Number (PIB):</label>
              <input type = 'text' id = 'taxId' [(ngModel)] = 'taxId' name = 'taxId'>
            </div>
          </div>
          <div class = 'form-group'>
            <label for = 'registrationNumber'>Registration Number:</label>
            <input type = 'text' id = 'registrationNumber' [(ngModel)] = 'registrationNumber' name = 'registrationNumber'>
          </div>
        </div>
      }

      <div class = 'form-group'>
        <label for = 'profilePicture'>Profile Picture:</label>
        <input type = 'file' id ='"profilePicture' (change) = 'onFileSelected($event)' accept='image/*'>
      </div>

      <button type = 'submit' class = 'btn-submit'>Register</button>

      <p class = 'login-link'>
        Already have an account? <a routerLink = '/login'>Login here</a>
      </p>
    </form>
  </div>
</div>

<footer style="position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 0; border-top: 1px solid #edf2f7; text-align: center; color: #718096; font-size: 14px; background-color: #f7fafc; border-radius: 8px;">
  <p style="margin: 0;">&copy; 2026 PIA. All rights reserved.</p>
</footer>
